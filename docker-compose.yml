services:
  app:
    image: php:8.2-cli
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8080:8080"
    command: php -S 0.0.0.0:8080 -t public

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: php_redis
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"